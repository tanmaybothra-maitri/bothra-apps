<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Checklist</title>
<style>
  :root {
    --bg: #f7f5f2; --card: #ffffff; --ink: #1d1b19; --mut: #8a837c; --line: #ebe6e0;
    --acc: #9a2626; --acc-soft: #f6e7e5; --ok: #2f7d4f; --red: #c0392b;
    --r: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  input, select, textarea { font: inherit; color: inherit; }

  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 14px 16px 8px; }
  .top { display: flex; align-items: center; gap: 10px; }
  .top h1 { font-size: 20px; margin: 0; font-weight: 700; flex: 1; letter-spacing: -.2px; }
  .ico { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--mut); }
  .ico:active { background: var(--line); }
  .prog { display: flex; align-items: center; gap: 10px; margin-top: 6px; color: var(--mut); font-size: 13px; }
  .bar { flex: 1; height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .3s; }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px 4px; margin: 0 -16px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 7px 13px; border-radius: 999px; background: var(--card); border: 1px solid var(--line);
    font-size: 14px; white-space: nowrap; }
  .chip b { font-weight: 600; color: var(--mut); margin-left: 4px; font-size: 12px; }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .chip.on b { color: #cfc8c0; }
  .chip.warn b { color: var(--red); }

  main { padding: 4px 16px 110px; }
  .day { font-size: 12px; font-weight: 600; color: var(--mut); text-transform: uppercase; letter-spacing: .5px; margin: 18px 4px 8px; }
  .day.late { color: var(--red); }
  .list { background: var(--card); border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); }
  .row { display: flex; align-items: flex-start; gap: 12px; padding: 13px 14px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .tick { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid #cfc8c0; margin-top: 1px;
    display: grid; place-items: center; transition: all .15s; }
  .tick svg { opacity: 0; }
  .row.done .tick { background: var(--ok); border-color: var(--ok); }
  .row.done .tick svg { opacity: 1; }
  .body { flex: 1; min-width: 0; }
  .t { font-weight: 550; }
  .row.done .t { color: var(--mut); text-decoration: line-through; }
  .s { font-size: 13px; color: var(--mut); margin-top: 2px; display: flex; flex-wrap: wrap; gap: 0 8px; }
  .s .no { color: var(--red); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); flex: none; margin-top: 9px; }

  .donebtn { display: block; margin: 22px auto 0; color: var(--mut); font-size: 14px; padding: 8px 14px; }
  .empty { text-align: center; color: var(--mut); padding: 60px 20px; }

  .fab { position: fixed; right: 18px; bottom: calc(22px + env(safe-area-inset-bottom)); width: 56px; height: 56px;
    border-radius: 50%; background: var(--acc); color: #fff; display: grid; place-items: center;
    box-shadow: 0 6px 18px rgba(154,38,38,.35); z-index: 6; }

  .scrim { position: fixed; inset: 0; background: rgba(20,16,12,.35); z-index: 20; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--card); border-radius: 20px 20px 0 0;
    max-height: 92vh; overflow-y: auto; transform: translateY(105%); transition: transform .25s ease;
    padding: 8px 18px calc(18px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
  .sheet.on { transform: none; }
  .grab { width: 36px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 12px; }
  .sh { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .sh h2 { flex: 1; margin: 0; font-size: 17px; }
  .lbl { font-size: 12px; color: var(--mut); font-weight: 600; margin: 14px 0 6px; }
  .in { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  textarea.in { min-height: 70px; resize: vertical; }
  .in:focus { outline: 2px solid var(--acc-soft); border-color: var(--acc); }
  .pair { display: flex; gap: 10px; }
  .pair > * { flex: 1; min-width: 0; }
  .who { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--bg); border-radius: 10px; margin-top: 8px; }
  .who .n { flex: 1; min-width: 0; }
  .who .n small { display: block; color: var(--mut); font-size: 12px; }
  .cbtn { width: 36px; height: 36px; border-radius: 50%; background: #fff; display: grid; place-items: center; border: 1px solid var(--line); }
  .cbtn.wa { color: #1f9d55; }
  .cbtn.ph { color: var(--ink); }
  .primary { width: 100%; margin-top: 18px; padding: 13px; border-radius: 12px; background: var(--acc); color: #fff; font-weight: 600; }
  .primary:disabled { opacity: .5; }
  .ghost { width: 100%; margin-top: 8px; padding: 12px; border-radius: 12px; color: var(--mut); }
  .meta { font-size: 12px; color: var(--mut); margin-top: 4px; }

  .vrow { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); }
  .vrow:first-child { border-top: 0; }
  .vrow .n { flex: 1; min-width: 0; }
  .vrow .n small { display: block; color: var(--mut); font-size: 12px; }

  .toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
    background: var(--ink); color: #fff; padding: 10px 14px; border-radius: 12px; font-size: 14px; display: flex; gap: 14px;
    align-items: center; opacity: 0; pointer-events: none; transition: all .2s; z-index: 30; max-width: calc(100% - 32px); }
  .toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button { color: #f3c9a1; font-weight: 600; }
  .load { text-align: center; color: var(--mut); padding: 80px 0; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Checklist</h1>
    <button class="ico" id="vendBtn" aria-label="Vendors">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v11h16V9"/><path d="M9 20v-6h6v6"/></svg>
    </button>
    <button class="ico" id="refBtn" aria-label="Refresh">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
  </div>
  <div class="prog"><div class="bar"><i id="barFill"></i></div><span id="progTxt"></span></div>
  <div class="chips" id="chips"></div>
</header>

<main id="main"><div class="load">Loading…</div></main>

<button class="fab" id="addBtn" aria-label="Add task">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"><span id="toastTxt"></span><button id="toastBtn"></button></div>

<script>
var KEY = '';
var S = { tasks: [], people: [], vendors: [], who: 'All', showDone: false };
var TICK_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
var PH_SVG = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>';
var WA_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .2-1.2c-.1-.1-.3-.2-.5-.3z"/></svg>';

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function digits(p) { var d = String(p || '').replace(/\D/g, ''); if (d.length === 10) d = '91' + d; return d; }
function waUrl(p) { return 'https:' + '/' + '/wa.me/' + digits(p); }
function telUrl(p) { return 'tel:+' + digits(p); }

function call(fn, args, ok, fail) {
  var r = google.script.run.withSuccessHandler(ok || function () {}).withFailureHandler(function (e) {
    toast((e && e.message) || 'Something went wrong', '', null);
    if (fail) fail(e);
  });
  r[fn].apply(r, [KEY].concat(args || []));
}

function load(quiet) {
  if (!quiet) $('main').innerHTML = '<div class="load">Loading…</div>';
  call('checklist_load', [], function (d) {
    S.tasks = d.tasks; S.people = d.people; S.vendors = d.vendors;
    render();
  }, function (e) {
    $('main').innerHTML = '<div class="empty">' + esc((e && e.message) || 'Could not load') + '</div>';
  });
}

function parseDue(s) { if (!s) return null; var m = s.match(/(\d+)-(\d+)-(\d+)T(\d+):(\d+)/); return m ? new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5]) : null; }
function isDone(t) { return t.status === 'Done' || t.status === 'Not needed'; }
function isLate(t) { var d = parseDue(t.due); return !isDone(t) && d && d < new Date(); }
var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
var MONS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function dayLabel(d) {
  if (!d) return 'No date';
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var x = new Date(d); x.setHours(0, 0, 0, 0);
  var diff = Math.round((x - today) / 864e5);
  var base = DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONS[d.getMonth()];
  return diff === 0 ? 'Today · ' + base : diff === 1 ? 'Tomorrow · ' + base : base;
}
function hm(d) { return d ? String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') : ''; }

function inView(t) {
  if (S.who === 'All') return true;
  if (S.who === '__none') return !t.owner;
  return t.owner === S.who;
}

function renderChips() {
  var open = S.tasks.filter(function (t) { return !isDone(t); });
  var cnt = function (f) { return open.filter(f).length; };
  var items = [{ k: 'All', n: open.length, label: 'All' }];
  var unassigned = cnt(function (t) { return !t.owner; });
  if (unassigned) items.push({ k: '__none', n: unassigned, label: 'No owner', warn: true });
  S.people.forEach(function (p) {
    var n = cnt(function (t) { return t.owner === p.name; });
    if (n || S.who === p.name) items.push({ k: p.name, n: n, label: p.name });
  });
  $('chips').innerHTML = items.map(function (c) {
    return '<button class="chip' + (S.who === c.k ? ' on' : '') + (c.warn ? ' warn' : '') + '" data-k="' + esc(c.k) + '">' + esc(c.label) + '<b>' + c.n + '</b></button>';
  }).join('');
  Array.prototype.forEach.call($('chips').children, function (b) {
    b.onclick = function () { S.who = b.getAttribute('data-k'); render(); window.scrollTo(0, 0); };
  });
}

function rowHtml(t) {
  var d = parseDue(t.due), late = isLate(t);
  var bits = [];
  bits.push(t.owner ? esc(t.owner) : '<span class="no">No owner</span>');
  if (t.vendor && t.vendor !== 'In-house') bits.push(esc(t.vendor));
  if (d) bits.push(hm(d));
  return '<div class="row' + (isDone(t) ? ' done' : '') + '" data-id="' + esc(t.id) + '">' +
    '<button class="tick" aria-label="Done">' + TICK_SVG + '</button>' +
    '<div class="body"><div class="t">' + esc(t.task) + '</div><div class="s">' + bits.map(function (b) { return '<span>' + b + '</span>'; }).join('') + '</div></div>' +
    (late ? '<span class="dot" title="Overdue"></span>' : '') + '</div>';
}

function render() {
  var all = S.tasks.filter(inView);
  var done = all.filter(isDone).length;
  var tot = S.tasks.length, totDone = S.tasks.filter(isDone).length;
  $('barFill').style.width = (tot ? Math.round(100 * totDone / tot) : 0) + '%';
  $('progTxt').textContent = totDone + ' / ' + tot + ' done';
  renderChips();

  var open = all.filter(function (t) { return !isDone(t); }).sort(function (a, b) { return (a.due || '9') < (b.due || '9') ? -1 : (a.due || '9') > (b.due || '9') ? 1 : 0; });
  var groups = [], byKey = {};
  open.forEach(function (t) {
    var d = parseDue(t.due);
    var k = isLate(t) ? 'late' : d ? d.toDateString() : 'none';
    if (!byKey[k]) { byKey[k] = { k: k, label: k === 'late' ? 'Overdue' : dayLabel(d), items: [] }; groups.push(byKey[k]); }
    byKey[k].items.push(t);
  });
  groups.sort(function (a, b) { return a.k === 'late' ? -1 : b.k === 'late' ? 1 : 0; });

  var h = '';
  if (!open.length) h += '<div class="empty">' + (all.length ? 'All done here 🎉' : 'No tasks') + '</div>';
  groups.forEach(function (g) {
    h += '<div class="day' + (g.k === 'late' ? ' late' : '') + '">' + esc(g.label) + '</div><div class="list">' + g.items.map(rowHtml).join('') + '</div>';
  });
  if (done) {
    h += '<button class="donebtn" id="doneToggle">' + (S.showDone ? 'Hide' : 'Show') + ' done (' + done + ')</button>';
    if (S.showDone) h += '<div class="list" style="margin-top:8px">' + all.filter(isDone).map(rowHtml).join('') + '</div>';
  }
  $('main').innerHTML = h;
  if ($('doneToggle')) $('doneToggle').onclick = function () { S.showDone = !S.showDone; render(); };
  Array.prototype.forEach.call(document.querySelectorAll('.row'), function (r) {
    var id = r.getAttribute('data-id');
    r.querySelector('.tick').onclick = function (e) { e.stopPropagation(); tick(id); };
    r.onclick = function () { openTask(id); };
  });
}

function find(id) { for (var i = 0; i < S.tasks.length; i++) if (S.tasks[i].id === id) return S.tasks[i]; return null; }

function tick(id) {
  var t = find(id); if (!t) return;
  var was = t.status, nowDone = !isDone(t);
  t.status = nowDone ? 'Done' : 'Not started';
  render();
  call('checklist_tick', [id, nowDone], null, function () { t.status = was; render(); });
  if (nowDone) toast('Done · ' + t.task, 'Undo', function () {
    t.status = was; render(); call('checklist_tick', [id, false]);
  });
}

var toastTimer;
function toast(msg, btn, fn) {
  $('toastTxt').textContent = msg;
  $('toastBtn').textContent = btn || '';
  $('toastBtn').style.display = btn ? '' : 'none';
  $('toastBtn').onclick = function () { $('toast').classList.remove('on'); if (fn) fn(); };
  $('toast').classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { $('toast').classList.remove('on'); }, 3500);
}

function openSheet(html) { $('sheet').innerHTML = '<div class="grab"></div>' + html; $('sheet').classList.add('on'); $('scrim').classList.add('on'); }
function closeSheet() { $('sheet').classList.remove('on'); $('scrim').classList.remove('on'); }
$('scrim').onclick = closeSheet;

function person(n) { for (var i = 0; i < S.people.length; i++) if (S.people[i].name === n) return S.people[i]; return null; }
function vendor(n) { for (var i = 0; i < S.vendors.length; i++) if (S.vendors[i].name === n) return S.vendors[i]; return null; }

function contact(name, sub, phone) {
  return '<div class="who"><div class="n">' + esc(name) + '<small>' + esc(sub) + (phone ? ' · ' + esc(phone) : ' · no number') + '</small></div>' +
    (phone ? '<a class="cbtn wa" href="' + waUrl(phone) + '" target="_blank" aria-label="WhatsApp">' + WA_SVG + '</a><a class="cbtn ph" href="' + telUrl(phone) + '" aria-label="Call">' + PH_SVG + '</a>' : '') + '</div>';
}

function opts(list, sel, emptyLabel, addLabel) {
  var h = '<option value="">' + emptyLabel + '</option>';
  list.forEach(function (x) { h += '<option' + (x.name === sel ? ' selected' : '') + '>' + esc(x.name) + '</option>'; });
  return h + '<option value="__add">' + addLabel + '</option>';
}

function openTask(id) {
  var t = id ? find(id) : { task: '', details: '', owner: S.who !== 'All' && S.who !== '__none' ? S.who : '', vendor: '', due: '' };
  if (!t) return;
  var h = '<div class="sh"><h2>' + (id ? esc(t.id) : 'New task') + '</h2><button class="ico" onclick="closeSheet()" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>';
  if (id) {
    var p = person(t.owner), v = vendor(t.vendor);
    if (t.owner) h += contact(t.owner, 'Responsible', p && p.phone);
    if (t.vendor && t.vendor !== 'In-house') h += contact(t.vendor, (v && v.what) || 'Vendor', v && v.phone);
    if (t.qty) h += '<div class="meta">Qty: ' + esc(t.qty) + (t.phase ? ' · ' + esc(t.phase) : '') + '</div>';
  }
  h += '<div class="lbl">Task</div><input class="in" id="fTask" value="' + esc(t.task) + '" placeholder="What needs doing">' +
    '<div class="lbl">Details</div><textarea class="in" id="fDet" placeholder="Quantity, colour, address, timing…">' + esc(t.details) + '</textarea>' +
    '<div class="pair"><div><div class="lbl">Responsible</div><select class="in" id="fOwner">' + opts(S.people, t.owner, 'Choose', '+ New person') + '</select></div>' +
    '<div><div class="lbl">Vendor</div><select class="in" id="fVend">' + opts(S.vendors, t.vendor, 'Not decided', '+ New vendor') + '</select></div></div>' +
    '<div class="lbl">Due</div><input class="in" type="datetime-local" id="fDue" value="' + esc(t.due) + '">' +
    '<button class="primary" id="fSave">' + (id ? 'Save' : 'Add task') + '</button>' +
    (id ? '<button class="ghost" id="fTick">' + (isDone(t) ? 'Mark not done' : 'Mark done') + '</button>' : '<button class="ghost" id="fCancel">Cancel</button>');
  openSheet(h);
  if (!id) setTimeout(function () { $('fTask').focus(); }, 250);

  $('fOwner').onchange = function () { if (this.value === '__add') addPerson(this); };
  $('fVend').onchange = function () { if (this.value === '__add') addVendor(this); };
  if ($('fCancel')) $('fCancel').onclick = closeSheet;
  if ($('fTick')) $('fTick').onclick = function () { closeSheet(); tick(id); };
  $('fSave').onclick = function () {
    var obj = { id: id || '', task: $('fTask').value.trim(), details: $('fDet').value.trim(), owner: $('fOwner').value, vendor: $('fVend').value, due: $('fDue').value };
    if (!obj.task) { $('fTask').focus(); return; }
    if (obj.owner === '__add') obj.owner = '';
    if (obj.vendor === '__add') obj.vendor = '';
    var btn = this; btn.disabled = true; btn.textContent = 'Saving…';
    call('checklist_saveTask', [obj], function (newId) {
      if (id) { t.task = obj.task; t.details = obj.details; t.owner = obj.owner; t.vendor = obj.vendor; t.due = obj.due; }
      else S.tasks.push({ id: newId, task: obj.task, details: obj.details, owner: obj.owner, vendor: obj.vendor, due: obj.due, status: 'Not started' });
      closeSheet(); render(); toast(id ? 'Saved' : 'Task added', '', null);
    }, function () { btn.disabled = false; btn.textContent = id ? 'Save' : 'Add task'; });
  };
}

function addPerson(sel) {
  var name = (prompt('Name') || '').trim();
  if (!name) { sel.value = ''; return; }
  var phone = (prompt('Phone (optional)') || '').trim();
  call('checklist_addPerson', [{ name: name, phone: phone }], function () {
    S.people.push({ name: name, phone: phone });
    var o = document.createElement('option'); o.textContent = name; sel.insertBefore(o, sel.lastChild); sel.value = name;
  }, function () { sel.value = ''; });
}

function addVendor(sel) {
  var name = (prompt('Vendor name') || '').trim();
  if (!name) { sel.value = ''; return; }
  var phone = (prompt('Phone') || '').trim();
  call('checklist_saveVendor', [{ name: name, phone: phone, what: '' }], function () {
    S.vendors.push({ name: name, phone: phone, what: '' });
    var o = document.createElement('option'); o.textContent = name; sel.insertBefore(o, sel.lastChild); sel.value = name;
  }, function () { sel.value = ''; });
}

function openVendors() {
  var h = '<div class="sh"><h2>Vendors</h2><button class="ico" onclick="closeSheet()" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div>' + (S.vendors.length ? S.vendors.map(function (v, i) {
    var n = S.tasks.filter(function (t) { return t.vendor === v.name && !isDone(t); }).length;
    return '<div class="vrow"><div class="n">' + esc(v.name) + '<small>' + esc(v.what || '') + (v.what ? ' · ' : '') + n + ' open · ' + (v.phone ? esc(v.phone) : 'no number') + '</small></div>' +
      (v.phone ? '<a class="cbtn wa" href="' + waUrl(v.phone) + '" target="_blank">' + WA_SVG + '</a><a class="cbtn ph" href="' + telUrl(v.phone) + '">' + PH_SVG + '</a>' : '') +
      '<button class="cbtn" data-i="' + i + '" aria-label="Edit"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button></div>';
  }).join('') : '<div class="meta">No vendors yet.</div>') + '</div>' +
    '<div class="lbl">Add vendor</div><input class="in" id="vName" placeholder="Name">' +
    '<div class="pair" style="margin-top:8px"><input class="in" id="vWhat" placeholder="Supplies (e.g. dhol)"><input class="in" id="vPhone" type="tel" placeholder="Phone"></div>' +
    '<button class="primary" id="vSave">Add vendor</button>';
  openSheet(h);
  var editing = null;
  Array.prototype.forEach.call(document.querySelectorAll('.vrow .cbtn[data-i]'), function (b) {
    b.onclick = function () {
      var v = S.vendors[+b.getAttribute('data-i')]; editing = v.name;
      $('vName').value = v.name; $('vWhat').value = v.what || ''; $('vPhone').value = v.phone || '';
      $('vSave').textContent = 'Save ' + v.name; $('vName').focus();
    };
  });
  $('vSave').onclick = function () {
    var obj = { name: $('vName').value.trim(), what: $('vWhat').value.trim(), phone: $('vPhone').value.trim(), oldName: editing || '' };
    if (!obj.name) { $('vName').focus(); return; }
    var btn = this; btn.disabled = true;
    call('checklist_saveVendor', [obj], function () {
      if (editing) {
        var v = vendor(editing); v.name = obj.name; v.what = obj.what; v.phone = obj.phone;
        S.tasks.forEach(function (t) { if (t.vendor === editing) t.vendor = obj.name; });
      } else S.vendors.push({ name: obj.name, what: obj.what, phone: obj.phone });
      openVendors(); render(); toast('Vendor saved', '', null);
    }, function () { btn.disabled = false; });
  };
}

$('addBtn').onclick = function () { openTask(null); };
$('vendBtn').onclick = openVendors;
$('refBtn').onclick = function () { load(false); };
document.addEventListener('visibilitychange', function () { if (!document.hidden && KEY) load(true); });

google.script.url.getLocation(function (loc) {
  KEY = (loc.parameter && loc.parameter.k) || '';
  load(false);
});
</script>
</body>
</html>
