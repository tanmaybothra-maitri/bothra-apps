<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6a52">
<style>
  :root{--bg:#f3f4f1;--card:#fff;--ink:#1c2420;--mut:#6b736e;--line:#e3e6e1;--pri:#2f6a52;--pri2:#e5f0ea;

        --r:14px;--sh:0 1px 2px rgba(0,0,0,.05),0 1px 8px rgba(0,0,0,.04)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",sans-serif}

  main{padding:12px 12px 100px;max-width:760px;margin:0 auto}

  .seg{display:flex;background:#e8eae6;border-radius:12px;padding:3px;margin-bottom:12px}

  .seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}

  .bi{display:inline-flex;flex-direction:column;align-items:center;line-height:1.15}.bi b{font-weight:800}.bi small{font-size:.68em;opacity:.85;font-weight:500}

  .mut{color:var(--mut)}

  .srch{position:relative;margin-top:10px} .srch input{width:100%;border:0;border-radius:12px;padding:12px 14px;font-size:16px}

  .tabs{display:flex;gap:6px;padding:10px 12px 0;max-width:760px;margin:0 auto}

  .tabs button b{color:var(--ink);margin-left:2px} .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)} .tabs button.on b{color:#fff}
  main.cm{padding:8px 12px 96px}
  nav.bn button{position:relative} nav.bn i{position:absolute;top:3px;left:calc(50% + 6px);font-style:normal;background:#e7e9e5;color:var(--ink);border-radius:9px;padding:0 6px;font-size:11px;font-weight:700;line-height:17px}

  .nx2{margin:-2px 12px 8px;font-size:12.5px;color:var(--ink);background:#f4f5f2;border-radius:8px;padding:5px 9px}
  .cn.plan{background:var(--red2);color:var(--red)}

  .clw{margin:-2px 12px 8px;font-size:12.5px;color:var(--red);font-weight:600}

  .btn.warnb{background:#fff;border:1.5px solid var(--red);color:var(--red)}

<body>
<div id="app"><div class="empty"><b>🚗</b>Loading…</div></div>
<script>

const PARAMS = <?!= params ?>;
const DRIVER = PARAMS.app === 'driver';
const TZ = 'Asia/Kolkata';
const S = { pin: '', who: '', base: null, live: null, mode: 'post', post: '', view: 'live', date: '', f: { q: '', type: '', place: '', open: false }, place: '', planTab: 'guests', busy: 0, drv: null, share: false };
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/* Phones often wipe or block storage inside the Google page, so the sign-in also lives in the address bar:
   the home-screen icon and any reopened tab carry it and open straight in. */
function keepUrl(q) { try { google.script.history.replace(null, q, ''); } catch (e) {} try { window.top.postMessage({ bothraApp: 1, q: q }, 'https:' + String.fromCharCode(47, 47) + 'tanmaybothra-maitri.github.io'); } catch (e) {} }
const store = { get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

/* ---------- formatting ---------- */
const hm = ms => ms ? new Date(ms).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: TZ }) : '';
const today = () => new Date().toLocaleDateString('en-CA', { timeZone: TZ });
const dayLabel = d => new Date(d + 'T12:00:00+05:30').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: TZ });
const mins = ms => Math.round(ms / 60000);
const inMin = ms => { const m = mins(ms - Date.now()); return m > 0 ? 'in ' + (m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min') : m === 0 ? 'now' : Math.abs(m) + ' min ago'; };
const ago = ms => { const m = mins(Date.now() - ms); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : Math.floor(m / 60) + ' h ago'; };
const digits = p => { let d = String(p || '').replace(/\D/g, ''); if (d.length === 10) d = '91' + d; return d; };
const WEB = 'https:' + String.fromCharCode(47, 47);
const mapAt = (lat, lng) => WEB + 'www.google.com/maps/search/?api=1&query=' + lat + ',' + lng;
const waLink = (p, msg) => WEB + 'wa.me/' + digits(p) + (msg ? '?text=' + encodeURIComponent(msg) : '');
const okPhone = p => digits(p).length >= 11;
const icons = (p, msg) => `<span class="icons"><a class="ic call ${okPhone(p) ? '' : 'off'}" href="tel:+${digits(p)}" title="Call">📞</a><a class="ic wa ${okPhone(p) ? '' : 'off'}" target="_blank" href="${waLink(p, msg)}" title="WhatsApp">💬</a></span>`;
const bi = (h, e) => `<span class="bi"><b>${h}</b><small>${e}</small></span>`;
const tx = (h, e) => DRIVER ? bi(h, e) : e;
const tt = (h, e) => DRIVER ? h + ' · ' + e : e;
function toast(m, undoFn) {
  $$('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = esc(m) + (undoFn ? ' <button class="tundo">' + tt('वापस', 'Undo') + '</button>' : '');
  document.body.appendChild(t);
  if (undoFn) t.querySelector('.tundo').onclick = () => { t.remove(); undoFn(); };
  setTimeout(() => t.remove(), undoFn ? 9000 : 2400);
}
function loading(on) { S.busy += on ? 1 : -1; let l = $('.loading'); if (S.busy > 0 && !l) { l = document.createElement('div'); l.className = 'loading'; document.body.appendChild(l); } if (S.busy <= 0 && l) { l.remove(); S.busy = 0; } }

function data() { return DRIVER ? S.drv : S.base; }
function pname(c) { const p = (data().places || {})[c]; return p ? p.name : c; }
function plink(c) { const p = (data().places || {})[c]; return p ? p.map : WEB + 'www.google.com/maps/search/?api=1&query=' + encodeURIComponent(c + ' Ahmedabad'); }
function drive(a, b) { const d = data().drive || {}; return a === b ? 0 : (d[a + '|' + b] || 40); }
function statusMap() { return DRIVER ? S.drv.status : S.live.status; }
function carInfo(date, car) { return (data().cars || []).find(c => c.date === date && c.car === car) || { car: car, date: date }; }

/* ---------- trip state ---------- */
const FLOW = ['On the way', 'At pickup', 'Guests in car', 'Dropped'];
const STEPS = ['At pickup', 'Guests in car', 'Dropped'];
const NEXT_LABEL = { 'On the way': 'I’m on the way', 'At pickup': 'Reached pickup', 'Guests in car': 'Guests are in the car', 'Dropped': 'Dropped everyone' };
const DESK_LABEL = { 'On the way': 'Mark on the way', 'At pickup': 'Mark at pickup', 'Guests in car': 'Mark guests in car', 'Dropped': 'Mark dropped' };
const DRV_HI = { 'At pickup': ['पहुँच गया', 'I have reached'], 'Guests in car': ['मेहमान बैठ गए', 'Guests are in'], 'Dropped': ['छोड़ दिया', 'Dropped'] };
const POST_HI = { 'At pickup': ['गाड़ी आ गई', 'Car is here'], 'Guests in car': ['गाड़ी निकल गई', 'Car has left'], 'Dropped': ['गाड़ी पहुँच गई', 'Car arrived'] };
const PILL_HI = { 'Not started': 'अभी नहीं', 'On the way': 'रास्ते में', 'At pickup': 'पहुँच गई', 'Late': 'लेट', 'Problem': 'दिक्कत', 'Cancelled': 'कैंसल' };
function st(d) {
  const s = statusMap()[d.key] || null, now = Date.now(), x = { s, st: s ? s.status : '', pill: 'Not started', cls: '', eta: '', late: false, done: false, step: 0, prob: false };
  if (x.st === 'Dropped') return Object.assign(x, { pill: 'Done ' + hm(s.at), cls: 'p-done', done: true, step: 4, eta: 'Dropped at ' + pname(d.to) + ' at ' + hm(s.at) + (s.pax != null ? ' · ' + s.pax + ' people' : '') });
  if (x.st === 'Cancelled') return Object.assign(x, { pill: 'Cancelled', cls: 'p-bad', done: true, eta: s.note || '' });
  if (x.st === 'Problem') return Object.assign(x, { pill: 'Problem', cls: 'p-bad', prob: true, late: true, eta: '⚠ ' + (s.note || 'Problem reported') + ' · ' + ago(s.at) });
  if (x.st === 'Guests in car') { const eta = s.at + drive(d.from, d.to) * 60000; return Object.assign(x, { pill: (s.pax != null ? s.pax : d.pax) + ' in car', cls: 'p-in', step: 3, eta: 'Reaching ' + pname(d.to) + ' ~' + hm(eta) + ' (' + inMin(eta) + ')', etaMs: eta, late: now > eta + 20 * 60000 }); }
  if (x.st === 'At pickup') return Object.assign(x, { pill: 'At pickup', cls: 'p-pick', step: 2, eta: 'Waiting at ' + pname(d.from) + ' since ' + hm(s.at), late: now > d.leave + 30 * 60000 });
  if (x.st === 'On the way') return Object.assign(x, { pill: 'On the way', cls: 'p-way', step: 1, eta: 'Due at ' + pname(d.from) + ' ' + hm(d.report) + ' (' + inMin(d.report) + ')', late: now > d.report + 15 * 60000 });
  x.late = now > d.report + 10 * 60000 && now < d.busy + 6 * 3600000;
  x.eta = x.late ? 'Should have been at ' + pname(d.from) + ' at ' + hm(d.report) + ' - not started' : 'Car at ' + pname(d.from) + ' ' + hm(d.report) + ' (' + inMin(d.report) + ') · reaches ' + hm(d.reach);
  if (x.late) Object.assign(x, { pill: 'Late', cls: 'p-bad' });
  return x;
}
const nextOf = cur => { const i = FLOW.indexOf(cur); return i < 0 ? FLOW[0] : FLOW[i + 1] || ''; };
const nextStep = cur => { if (cur === 'Dropped' || cur === 'Cancelled') return ''; const i = STEPS.indexOf(cur); return i < 0 ? STEPS[0] : STEPS[i + 1] || ''; };
const pillHi = i => { const k = /^Done/.test(i.pill) ? '' : /in car$/.test(i.pill) ? 'गाड़ी में' : PILL_HI[i.pill] || ''; return (k ? k + ' · ' : '') + i.pill; };

/* ---------- bottom sheets ---------- */
function sheet(html, wireFn) {
  closeSheet();
  const o = document.createElement('div'); o.className = 'ov';
  o.innerHTML = `<div class="sheet"><div class="grab"></div>${html}</div>`;
  o.onclick = e => { if (e.target === o) closeSheet(); };
  document.body.appendChild(o); $$('[data-close]').forEach(b => b.onclick = closeSheet); wireFn && wireFn();
}
function closeSheet() { const o = $('.ov'); if (o) o.remove(); }
function askPax(d, done) {
  let n = d.pax || 1;
  sheet(`<h3>${tt('कितने लोग बैठे?', 'How many got in?')}</h3><div class="meta">${esc(d.car)} · ${esc(pname(d.from))} → ${esc(pname(d.to))} · planned ${d.pax}</div>
    <div class="stepper"><button id="mi">−</button><b id="nv">${n}</b><button id="pl">+</button></div>
    <button class="btn pri huge" id="ok">${tx('ठीक है', 'Confirm')}</button><button class="btn ghost" style="width:100%;margin-top:6px" data-close>Cancel</button>`, () => {
    $('#mi').onclick = () => { n = Math.max(0, n - 1); $('#nv').textContent = n; };
    $('#pl').onclick = () => { n = n + 1; $('#nv').textContent = n; };
    $('#ok').onclick = () => { closeSheet(); done(n); };
  });
}
function askProblem(d, done) {
  const opts = ['ट्रेन/फ्लाइट लेट · Train/flight late', 'मेहमान नहीं मिले · Guest not found', 'ट्रैफिक · Traffic', 'गाड़ी खराब · Car problem', 'जगह कम · Not enough seats', 'प्लान बदला · Plan changed'];
  sheet(`<h3>${tt('क्या दिक्कत है?', 'What’s the problem?')}</h3><div class="meta">${esc(d.car)} · ${hm(d.report)} ${esc(pname(d.from))} → ${esc(pname(d.to))}</div>
    <div class="chips">${opts.map(o => `<span>${DRIVER ? o : o.split(' · ').pop()}</span>`).join('')}</div><textarea id="nt" rows="2" placeholder="${DRIVER ? 'और कुछ / ' : ''}Anything else (optional)"></textarea>
    <button class="btn red huge" id="ok">${tx('डेस्क को बताएँ', 'Tell the travel desk')}</button><button class="btn ghost" style="width:100%;margin-top:6px" data-close>Cancel</button>`, () => {
    $$('.chips span').forEach(c => c.onclick = () => c.classList.toggle('on'));
    $('#ok').onclick = () => { const t = $$('.chips span.on').map(c => c.textContent.split(' · ').pop()).concat($('#nt').value.trim() ? [$('#nt').value.trim()] : []).join(' · '); closeSheet(); done(t || 'Problem'); };
  });
}
/* sends a status; the toast offers undo back to the previous status */
function sendStep(d, status, send) {
  const prev = statusMap()[d.key] ? Object.assign({}, statusMap()[d.key]) : null;
  const undo = () => prev ? send(d.key, prev.status, prev.pax, prev.note) : send(d.key, 'Reset', null, '');
  const go = (pax, note) => send(d.key, status, pax, note || '', undo);
  if (status === 'Guests in car' && d.event) return askPax(d, n => go(n));
  if (status === 'Guests in car') return go(d.pax);
  if (status === 'Problem') return askProblem(d, note => go(null, note));
  go(null);
}
function moreMenu(d, i, send) {
  sheet(`<h3>${esc(d.car)} · ${hm(d.report)}</h3><div class="meta">${esc(pname(d.from))} → ${esc(pname(d.to))}</div><div class="menu">
    ${!i.done ? '<button class="btn" id="m_prob">⚠️ Report a problem</button>' : ''}
    ${i.st ? '<button class="btn" id="m_undo">↩️ Clear status</button>' : ''}
    ${!DRIVER && !i.done ? '<button class="btn" id="m_cancel">🚫 Trip cancelled</button>' : ''}
    ${!DRIVER ? FLOW.filter(f => f !== nextOf(i.st)).map(f => `<button class="btn" data-set="${f}">Set: ${f}</button>`).join('') : ''}
    <a class="btn" target="_blank" href="${plink(d.from)}">🧭 Map: ${esc(pname(d.from))}</a><a class="btn" target="_blank" href="${plink(d.to)}">🧭 Map: ${esc(pname(d.to))}</a>
    <button class="btn ghost" data-close>Close</button></div>`, () => {
    const pb = $('#m_prob'); if (pb) pb.onclick = () => sendStep(d, 'Problem', send);
    const ub = $('#m_undo'); if (ub) ub.onclick = () => { closeSheet(); send(d.key, 'Reset', null, ''); };
    const cb = $('#m_cancel'); if (cb) cb.onclick = () => { closeSheet(); send(d.key, 'Cancelled', null, 'Cancelled by desk'); };
    $$('[data-set]').forEach(b => b.onclick = () => { closeSheet(); sendStep(d, b.dataset.set, send); });
  });
}

function wireTrips(list, send) {
  const find = k => list.find(x => x.key === k);
  $$('[data-go]').forEach(b => b.onclick = () => sendStep(find(b.dataset.go), b.dataset.st, send));
  $$('[data-prob]').forEach(b => b.onclick = () => sendStep(find(b.dataset.prob), 'Problem', send));
  $$('[data-more]').forEach(b => b.onclick = () => { const d = find(b.dataset.more); moreMenu(d, st(d), send); });
}

/* ======================= TRAVEL DESK ======================= */
function call(fn, args, ok, quiet) {
  if (!quiet) loading(true);
  google.script.run.withSuccessHandler(r => { if (!quiet) loading(false); ok(r); })
    .withFailureHandler(e => { if (!quiet) loading(false); unlockBtns(); if (/PIN/.test(e.message)) { S.pin = ''; store.set('la_pin', ''); renderLogin(e.message); } else if (!quiet) toast('⚠️ ' + e.message); })[fn].apply(null, args);
}
/* Saves without making anyone wait: the change shows at once, the save runs in the background,
   and the full plan reloads quietly afterwards. A failed save puts the plan back and says so. */
function saveBg(fn, args, okMsg) {
  S.pend = (S.pend || 0) + 1; render(); toast('Saving in the background…');
  const reload = () => google.script.run.withSuccessHandler(r => { if (!S.pend) apply(r); }).withFailureHandler(() => {}).logiApp_load(S.pin);
  google.script.run.withSuccessHandler(r => { S.pend--; toast(okMsg); if (r && r.base) apply(r); else reload(); })
    .withFailureHandler(e => { S.pend--; toast('⚠️ Not saved: ' + e.message); reload(); })[fn].apply(null, args);
}
function apply(r) { if (r.base) S.base = r.base; if (r.live) S.live = r.live; if (!S.date) S.date = pickDate(); saveCache(r); render(); }
/* last data kept on the phone so the app opens instantly; fresh data replaces it a moment later */
function saveCache(r) { try { if (r.base) localStorage.setItem('la_base', JSON.stringify(r.base)); if (r.live) localStorage.setItem('la_live', JSON.stringify(r.live)); } catch (e) {} }
function readCache() { try { const b = JSON.parse(localStorage.getItem('la_base') || 'null'), l = JSON.parse(localStorage.getItem('la_live') || 'null'); return b ? { base: b, live: l || { status: {}, where: {}, now: Date.now() } } : null; } catch (e) { return null; } }
function dates() { const s = {}; S.base.duties.forEach(d => s[d.date] = 1); S.base.cars.forEach(c => s[c.date] = 1); return Object.keys(s).sort(); }
function opDay(duties) { const now = Date.now(), t = today(), y = new Date(now - 86400000).toLocaleDateString('en-CA', { timeZone: TZ }); const h = Number(new Date(now).toLocaleTimeString('en-GB', { hour: '2-digit', hour12: false, timeZone: TZ })); return h < 4 && duties.some(d => d.date === y && d.busy > now - 30 * 60000) ? y : t; }
function pickDate() { const ds = dates(), t = opDay(S.base.duties); return ds.indexOf(t) >= 0 ? t : (ds.find(d => d > t) || ds[ds.length - 1] || t); }

function renderLogin(msg) {
  $('#app').innerHTML = `<div class="login"><div class="logo">🚗</div><h2>Travel desk</h2><div class="meta">Aman & Sandhya · Griha Pravesh</div>
    <input id="who" placeholder="Your name" value="${esc(store.get('la_who'))}" autocomplete="name"><input id="pin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off">
    <button class="btn pri big" style="width:100%;margin-top:8px" id="go">Open</button><p style="color:var(--red);font-size:13px">${esc(msg || '')}</p></div>`;
  const go = () => {
    const pin = $('#pin').value.trim(); S.who = $('#who').value.trim(); if (!S.who) return toast('Please enter your name'); store.set('la_who', S.who); if (!lockBtn($('#go'))) return;
    call('logiApp_session', [pin, S.who], tok => { S.pin = 'S:' + tok; store.set('la_pin', S.pin); keepUrl({ app: 'logistics', s: tok }); call('logiApp_load', [S.pin], r => { saveCache(r); afterLogin(r); }); });
  };
  $('#go').onclick = go; $('#pin').onkeydown = e => { if (e.key === 'Enter') go(); };

const SHORT = { HOTEL: 'Hotel', VENUE: 'Venue', ADI: 'Kalupur', SBIB: 'Sabarmati', AIR: 'Airport' };
const sp = c => SHORT[c] || String(pname(c) || c).replace(/\s*\(.*?\)\s*/g, ' ').trim().split(/\s+/).slice(0, 3).join(' ');
const isTransit = c => /station|airport/i.test(((S.base && S.base.places[c]) || {}).type || '') || ['ADI', 'SBIB', 'AIR'].indexOf(c) >= 0;
function locs() {
  if (S.locsV === S.base.version && S.locsC) return S.locsC;
  const used = new Set(); S.base.duties.forEach(d => { used.add(d.from); used.add(d.to); }); (S.base.legs || []).forEach(l => { used.add(l.from); used.add(l.to); });
  used.delete('');
  const tr = [...used].filter(isTransit), rest = [...used].filter(c => !isTransit(c));
  const rank = c => (['HOTEL', 'VENUE'].indexOf(c) + 1) || 9;
  S.locsC = [['ALL', 'All places', null]].concat(rest.sort((a, b) => rank(a) - rank(b) || sp(a).localeCompare(sp(b))).map(c => [c, sp(c), [c]]), tr.length ? [['STATION', 'Station / Airport', tr]] : []);
  S.locsV = S.base.version;
  return S.locsC;
}
const locOf = id => locs().find(l => l[0] === id) || locs()[0];
function nextOfCar(d) { return S.base.duties.filter(o => o.date === d.date && o.car === d.car && o.report > d.report && live2(o)).sort((a, b) => a.report - b.report)[0] || null; }
function famCars() { const f = {}; S.base.cars.filter(c => /HOME/i.test(c.source || '')).forEach(c => { f[c.car] = (c.owner || c.driver || 'Family').split(' ')[0]; }); return f; }
const inLoc = (p, id) => { const l = locOf(id); return !l[2] || l[2].indexOf(p) >= 0; };
const dur = ms => { const m = Math.max(0, mins(ms)); return m < 60 ? m + 'm' : Math.floor(m / 60) + 'h' + (m % 60 ? ' ' + (m % 60) + 'm' : ''); };
const isHome = (date, car) => /HOME/i.test(carInfo(date, car).source || '');
const homeName = (date, car) => { const o = carInfo(date, car).owner || carInfo(date, car).driver || ''; return o.split(' ')[0] || 'Family'; };
const ownLeft = (date, from, to) => Object.keys(statusMap()).filter(k => k.indexOf('OWN|' + date + '|' + from + '|' + to + '|') === 0).reduce((a, k) => a + (Number(statusMap()[k].pax) || 0), 0);
const stale = d => { const i = st(d); if (i.done) return false; const now = Date.now(); if (i.st === 'Guests in car') return now > (i.etaMs || d.reach) + 60 * 60000; return !i.st && now > d.busy + 45 * 60000; };
const isGone = d => { const s = statusMap()[d.key]; return !!s && (s.status === 'Guests in car' || s.status === 'Dropped'); };
const etaOf = d => st(d).etaMs || d.reach;
function schedTime(d) {
  const g = d.guests.find(x => /(arr|dep) \d\d:\d\d/.test(x.trip));
  if (!g) return '';
  const m = /(arr|dep) (\d\d:\d\d)/.exec(g.trip);
  return (d.from === 'AIR' || d.to === 'AIR' ? '✈ ' : '🚆 ') + m[2];
}

/* next action for a trip. dir: 'in' = coming to this place */
function act(d, dir) {
  const i = st(d);
  if (i.done) return null;
  if (dir === 'in' || i.st === 'Guests in car') return ['Dropped', 'Arrived'];
  if (i.st === 'At pickup') return ['Guests in car', 'Left'];
  return ['At pickup', 'Arrived'];

/* free windows: where each car waits between trips, and until when */
function freeWins(date) {
  const by = {};
  S.base.duties.filter(d => d.date === date && !isHome(date, d.car)).forEach(d => (by[d.car] = by[d.car] || []).push(d));
  const out = [];
  Object.keys(by).forEach(car => {
    const L = by[car].sort((a, b) => a.report - b.report);
    L.forEach((d, k) => {
      const n = L[k + 1], s = statusMap()[d.key];
      if (s && s.status === 'Cancelled') return;
      let at = d.to, from = d.reach;
      if (n && n.from !== d.to && d.event && n.from === d.from) { at = d.from; from = d.busy; }
      if (s && s.status === 'Dropped' && at === d.to) from = s.at;
      const till = n ? n.report - (at === n.from ? 0 : (drive(at, n.from) + 10) * 60000) : null;
      if (till !== null && till - from < 15 * 60000) return;
      out.push({ car, at, from, till, next: n || null });
    });
  });
  return out;
}
function freeNow(date) {
  const now = Date.now(), isToday = date === opDay(S.base.duties);
  return freeWins(date).filter(w => isToday ? w.from <= now && (w.till === null || w.till > now) : true);
}
/* same model as the sheet: after a trip the car is free at reach + drive to the next pickup (event trips already carry a buffer) */
function live2(o) { const x = statusMap()[o.key]; return !(x && (x.status === 'Cancelled' || x.status === 'Dropped')); }
function freeAt(o, d) { const t = o.to === d.from ? 0 : drive(o.to, d.from) + 10 - (o.event ? 10 : 0); return Math.max(o.reach + t * 60000, /standby/.test(o.type) ? o.busy : 0); }
function clashPair(a, b) { const p = a.report <= b.report ? a : b, n = p === a ? b : a; return freeAt(p, n) > n.report + 60000; }
function conflicts(car, d) { return S.base.duties.filter(o => o.date === d.date && o.car === car && o.key !== d.key && live2(o) && clashPair(o, d)); }
function canDo(car, d) { return isHome(d.date, car) || !conflicts(car, d).length; }
function clashesOf(d) { return isHome(d.date, d.car) || !live2(d) ? [] : conflicts(d.car, d); }
function busyText(car, d) { const c = conflicts(car, d).sort((x, y) => x.report - y.report)[0]; return c ? 'busy ' + hm(c.report) + '–' + hm(c.reach) + ' ' + sp(c.from) + '→' + sp(c.to) : ''; }
function lastPlace(car, date, t) {
  const p = S.base.duties.filter(o => o.date === date && o.car === car && o.reach <= t).sort((a, b) => b.reach - a.reach)[0];
  return p ? p.to : '';
}

/* ---------- trip facts used on every card ---------- */
const isCab = d => /^Cab /.test(d.car || '');
const recJ = k => { const s = S.live.status[k]; if (!s) return null; let o = {}; try { o = JSON.parse(s.note || '{}') || {}; } catch (e) {} return Object.assign({ at: s.at, by: s.by, pax: s.pax }, o); };
const cabOf = d => { const s = S.live.status['CAB|' + d.key]; return s && s.status === 'Booked' ? recJ('CAB|' + d.key) : null; };
const hcOf = d => { const s = S.live.status['PAX|' + d.key]; return s && s.status === 'Headcount' ? recJ('PAX|' + d.key) : null; };
const roomOf = g => (S.base.rooms || {})[g.id] || '';
const gIn = d => { const h = hcOf(d), out = h && h.out || []; return d.guests.filter(g => out.indexOf(g.id) < 0); };
const paxOf = d => { const h = hcOf(d); if (h && !d.event) return gIn(d).reduce((a, g) => a + (g.pax || 1), 0) + (Number(h.extra) || 0); const s = statusMap()[d.key]; return s && s.pax != null ? s.pax : d.pax; };
const roundName = d => String(d.trip || '').replace(/^E\d+ \S+ - /, '').replace(/ \(.*\)$/, '') || 'Shuttle';
const whereOf = d => S.live.where[d.date + '|' + d.car] || null;
const seenRecent = d => { const w = whereOf(d); return w && w.at && Date.now() - w.at < 45 * 60000 ? w : null; };
/* the driver uses the app today: any tap or location from him on this day */
const usesApp = (date, car) => { const w = S.live.where[date + '|' + car]; return !!(w && w.at) || S.base.duties.some(o => o.date === date && o.car === car && S.live.status[o.key] && /^Driver/.test(S.live.status[o.key].by || '')); };
const fullName = n => nameTc(n).replace(/\s+/g, ' ').trim();
function namesLine(d) {
  if (d.event) return 'Shuttle · ' + esc(roundName(d));
  const g = gIn(d).map(x => fullName(x.name)), extra = (hcOf(d) || {}).extra || 0;
  if (!g.length && !extra) return '<span class="mut">No guests</span>';
  return esc(g.slice(0, 3).join(', ')) + (g.length > 3 ? ' +' + (g.length - 3) : '') + (extra ? ' +' + extra + ' extra' : '');
}
/* what the driver (or the cab) last told us */
function drvState(d) {
  if (isCab(d)) { const c = cabOf(d); return c ? { t: '🚕 ' + (c.svc || 'Cab') + ' booked' + (c.reg ? ' · ' + c.reg : ''), c: 'grn' } : { t: '🚕 Cab not booked yet', c: 'red' }; }
  if (isHome(d.date, d.car)) return { t: '🏠 Family car', c: '' };
  const s = statusMap()[d.key], w = seenRecent(d);
  if (s) {
    if (s.status === 'Dropped') return { t: '✓ Dropped ' + hm(s.at), c: 'grn' };
    if (s.status === 'Guests in car') { const eta = s.at + drive(d.from, d.to) * 60000; return { t: '🚗 Guests in · reaches ~' + hm(eta), c: 'blu' }; }
    if (s.status === 'At pickup') return { t: '📍 At pickup since ' + hm(s.at), c: 'grn' };
    if (s.status === 'On the way') return { t: '🚗 Started ' + hm(s.at) + (w ? ' · seen ' + ago(w.at) : ''), c: 'blu' };
    if (s.status === 'Problem') return { t: '⚠ ' + (s.note || 'Problem'), c: 'red' };
    if (s.status === 'Cancelled') return { t: 'Cancelled', c: '' };
  }
  if (w) return { t: '📍 Driver seen ' + ago(w.at), c: '' };

}
function drvRow(d, attr) {
  const c = carInfo(d.date, d.car), cab = isCab(d), cb = cab ? cabOf(d) : null, x = drvState(d);
  const name = cab ? (cb && cb.driver ? cb.driver : 'Cab') : (c.driver ? c.driver.split(' ').slice(0, 2).join(' ') : '<span style="color:var(--red)">No driver</span>');
  const ph = cab ? (cb && cb.phone) : c.phone;
  return `<div class="dr" ${attr || ''}><div class="cn sm ${cab ? 'cab' : isHome(d.date, d.car) ? 'home' : ''}">${cab ? '🚕' : esc(d.car.replace(/^Car /, ''))}</div>
    <div class="mid"><div class="t2">${cab ? esc(name) : name} <span class="mut" style="font-weight:500">${esc(cab ? (cb && cb.reg || '') : c.reg || '')}</span></div><div class="dst ${x.c}">${esc(x.t)}</div></div>
    ${okPhone(ph) ? `<a class="call2" href="tel:+${digits(ph)}" onclick="event.stopPropagation()">📞 Call</a>` : ''}</div>`;
}
/* direction of a trip as seen from the chosen place */
function dirOf(d, L) { if (L === 'ALL') return ''; return inLoc(d.from, L) ? 'out' : inLoc(d.to, L) ? 'in' : ''; }
const tOf = (d, dir) => dir === 'in' ? etaOf(d) : d.leave;
function routeTxt(d, dir) { return dir === 'out' ? 'to ' + esc(sp(d.to)) : dir === 'in' ? 'from ' + esc(sp(d.from)) : esc(sp(d.from)) + ' → ' + esc(sp(d.to)); }

function subLine(d) {
  const x = [];
  const sch = schedTime(d); if (sch) x.push(sch + (d.guests[0] && d.guests[0].trip ? ' ' + esc(d.guests[0].trip.replace(/ \(.*$/, '').split(' ').slice(0, 3).join(' ')) : ''));
  if (d.hampers) x.push('🎁 ' + d.hampers);

}
function tripCard(d, dir, flag) {
  const red = !!flag;
  return `<div class="tc ${red ? 'r' : ''}" data-trip="${esc(d.key)}">
    ${flag ? `<div class="flag">${flag}</div>` : ''}
    <div class="tt"><span class="tm">${hm(tOf(d, dir))}</span><span class="dir">${routeTxt(d, dir)}</span>${dirTag(dir)}</div>
    <div class="gn">${namesLine(d)} <span class="mut">· ${paxOf(d)} ${paxOf(d) === 1 ? 'person' : 'people'}</span></div>${subLine(d)}

/* an event round = several cars leaving together: one card, one row per car */
function roundCard(list, dir) {
  const d = list[0], pax = list.reduce((a, x) => a + paxOf(x), 0);
  return `<div class="tc">
    <div class="tt"><span class="tm">${hm(tOf(d, dir))}</span><span class="dir">${routeTxt(d, dir)}</span>${dirTag(dir)}</div>
    <div class="gn">Shuttle · ${esc(roundName(d))} <span class="mut">· ${pax} people · ${list.length} car${list.length > 1 ? 's' : ''}</span></div>
    ${list.sort((a, b) => a.car.localeCompare(b.car, undefined, { numeric: true })).map(x => drvRow(x, `data-trip="${esc(x.key)}"`)).join('')}</div>`;
}
/* cards for a list of trips, event cars of the same round grouped */
function cardsOf(list, L) {
  const out = [], seen = {};
  list.forEach(d => {
    const dir = dirOf(d, L);
    if (d.event) {
      const k = [d.date, d.from, d.to, d.leave].join('|');
      if (seen[k]) return; seen[k] = 1;
      const same = list.filter(x => x.event && [x.date, x.from, x.to, x.leave].join('|') === k);
      out.push(same.length > 1 ? roundCard(same, dir) : tripCard(d, dir));
    } else out.push(tripCard(d, dir));
  });
  return out.join('');
}

/* ---------- what needs someone now ---------- */
const CAB_BOOK_MIN = 45, CAB_LATE_MIN = 10;
function needsYou(L, isToday) {
  const now = Date.now(), ds = S.base.duties.filter(d => d.date === S.date), items = [];
  const here = d => L === 'ALL' || inLoc(d.from, L) || inLoc(d.to, L);
  const live = d => { const s = statusMap()[d.key]; return !(s && (s.status === 'Dropped' || s.status === 'Cancelled')); };
  const soon = d => !isToday || d.report <= now + 3 * 3600000;
  const recent = d => !isToday || d.busy > now - 20 * 60000;
  ds.filter(d => here(d) && live(d) && recent(d)).forEach(d => {
    const s = statusMap()[d.key];
    if (isCab(d) && !cabOf(d) && isToday && (L === 'ALL' || inLoc(d.from, L)) && d.report - now <= CAB_BOOK_MIN * 60000 && d.report > now - 30 * 60000) {
      const late = d.report - now <= CAB_LATE_MIN * 60000;
      items.push({ t: d.report - 1, d, flag: late ? '🚕 Late - book the cab now · pickup ' + hm(d.report) : '🚕 Book cab now · pickup ' + hm(d.report) });
    } else if (s && s.status === 'Problem') items.push({ t: d.report, d, flag: '⚠ Driver reported: ' + esc(s.note || 'problem') });
    else if (soon(d) && !isCab(d) && clashesOf(d).length) items.push({ t: d.report, d, flag: '⚠ Car ' + esc(d.car.replace('Car ', '')) + ' is also on ' + clashesOf(d).map(o => hm(o.leave) + ' ' + esc(sp(o.from)) + '→' + esc(sp(o.to))).join(', ') });
    else if (isToday && !isCab(d) && !isHome(d.date, d.car) && !s && usesApp(d.date, d.car) && now > d.report && now < d.leave + 60 * 60000 && (L === 'ALL' || inLoc(d.from, L)))
      items.push({ t: d.report, d, flag: '⏰ Driver has not started · should be at ' + esc(sp(d.from)) + ' by ' + hm(d.report) });
    else if (L === 'ALL' && soon(d) && !isCab(d) && !isHome(d.date, d.car) && !(carInfo(d.date, d.car).driver && okPhone(carInfo(d.date, d.car).phone)))
      items.push({ t: d.report, d, flag: '👤 ' + esc(d.car) + ' has no driver / phone yet', drv: 1 });
  });
  const seen = {};
  const trips = items.filter(i => { if (i.drv) { const k = i.d.car; if (seen[k]) return false; seen[k] = 1; } return true; });
  const nocar = unmapped(S.date).filter(j => (L === 'ALL' || inLoc(j.from, L) || inLoc(j.to, L)) && (!isToday || (j.report <= now + 3 * 3600000 && j.reach > now - 30 * 60000)));
  return { trips: trips.sort((a, b) => a.t - b.t), nocar };
}
function noCarCard(j, L) {
  const dir = L === 'ALL' ? '' : inLoc(j.from, L) ? 'out' : 'in', t = dir === 'in' ? j.reach : j.leave;
  return `<div class="tc r"><div class="flag">🚫 No car yet</div>
    <div class="tt"><span class="tm">${hm(t)}</span><span class="dir">${dir === 'out' ? 'to ' + esc(sp(j.to)) : dir === 'in' ? 'from ' + esc(sp(j.from)) : esc(sp(j.from)) + ' → ' + esc(sp(j.to))}</span>${dirTag(dir)}</div>
    <div class="gn">${esc(j.legs.slice(0, 3).map(l => fullName(l.name)).join(', '))}${j.legs.length > 3 ? ' +' + (j.legs.length - 3) : ''} <span class="mut">· ${j.pax} people</span></div>
    ${j.train ? `<div class="s">${j.from === 'AIR' || j.to === 'AIR' ? '✈' : '🚆'} ${esc(j.train)}${j.time ? ' ' + esc(j.time) : ''}</div>` : ''}
    <button class="btn pri" style="width:100%;margin-top:10px" data-asg="${esc(j.id)}">Give a car</button></div>`;
}

/* ---------- Now screen ---------- */
function placeIcon(id) { const p = (S.base.places[id] || {}).type || ''; return id === 'ALL' ? '🖥' : id === 'STATION' ? '🚉' : id === 'HOTEL' || /hotel/i.test(p) ? '🏨' : id === 'VENUE' ? '🎉' : /home/i.test(p + ' ' + sp(id)) ? '🏠' : '📍'; }
function placeLabel(id) { return id === 'ALL' ? 'Desk' : locOf(id)[1]; }
function nowView() {
  const L = S.loc, now = Date.now(), isToday = S.date === opDay(S.base.duties), q = (S.q || '').trim().toLowerCase();
  const ds = S.base.duties.filter(d => d.date === S.date);
  if (q) {
    const num = /^\d+$/.test(q);
    const hit = ds.filter(d => { if (num) return d.car === 'Car ' + Number(q); const c = carInfo(d.date, d.car); return [d.car, c.reg, c.driver].concat(d.guests.map(g => g.name)).join(' ').toLowerCase().indexOf(q) >= 0; }).sort((a, b) => a.report - b.report);
    return hit.length ? hit.map(d => tripCard(d, dirOf(d, L))).join('') : '<div class="empty">No trips for “' + esc(S.q) + '”</div>';
  }
  const nd = needsYou(L, isToday), flagged = {};
  nd.trips.forEach(i => flagged[i.d.key] = 1);
  let h = deskCard();
  if (isToday) { const fr = freeHere(); h += `<button class="freec" id="freec">🅿️ <b>${fr.length}</b> car${fr.length === 1 ? '' : 's'} free ${L === 'ALL' ? 'now' : 'here now'}${fr.length ? '<span>' + fr.slice(0, 6).map(w => esc(w.car.replace('Car ', ''))).join(' · ') + ' ›</span>' : ''}</button>`; }
  const nN = nd.trips.length + nd.nocar.length;
  if (nN) h += `<div class="sec red">⚠ Needs you <span class="n">${nN}</span></div>` +
    nd.nocar.map(j => noCarCard(j, L)).concat(nd.trips.map(i => tripCard(i.d, dirOf(i.d, L), i.flag))).join('');
  const mine = ds.filter(d => (L === 'ALL' || inLoc(d.from, L) || inLoc(d.to, L)) && !flagged[d.key])
    .filter(d => { const s = statusMap()[d.key]; return !(s && s.status === 'Cancelled'); })
    .sort((a, b) => tOf(a, dirOf(a, L)) - tOf(b, dirOf(b, L)));
  if (!isToday) {
    h += `<div class="sec">All trips · ${dayLabel(S.date)} <span class="n">${mine.length}</span></div>` + (cardsOf(mine, L) || '<div class="empty">No trips on this day</div>');
    return h;
  }
  const gone = d => { const dir = dirOf(d, L), s = statusMap()[d.key]; if (s && s.status === 'Dropped') return true; return tOf(d, dir) < now - 20 * 60000 && !(s && s.status === 'Guests in car' && dir === 'in'); };
  const open = mine.filter(d => !gone(d));
  const next = open.filter(d => tOf(d, dirOf(d, L)) <= now + 60 * 60000), later = open.filter(d => next.indexOf(d) < 0), past = mine.filter(gone);
  h += `<div class="sec">Next hour</div>` + (cardsOf(next, L) || `<div class="empty sm">Nothing in the next hour${later.length ? ' · next at ' + hm(tOf(later[0], dirOf(later[0], L))) : ''}</div>`);
  if (later.length) h += `<details class="more" ${S.openLater ? 'open' : ''} id="later"><summary class="lat">Later today<b>${later.length} trip${later.length > 1 ? 's' : ''} ›</b></summary>${cardsOf(later, L)}</details>`;
  if (past.length) h += `<details class="more" id="past"><summary class="lat dim">Earlier today<b>${past.length} ›</b></summary>${cardsOf(past.reverse(), L)}</details>`;
  return h;
}
/* Desk only: tomorrow's (and today's leftover) driver links and guest messages */
function drvKey(c, day) { return 'DRV|' + day + '|' + c.car + '|' + digits(c.phone).slice(-10); }
function drvCars(day) { return S.base.cars.filter(c => c.date === day && !/HOME/i.test(c.source || '') && S.base.duties.some(d => d.date === day && d.car === c.car)).sort((a, b) => a.car.localeCompare(b.car, undefined, { numeric: true })); }
function drvStats(day) { const cs = drvCars(day), ok = c => c.driver && okPhone(c.phone); return { all: cs.length, sent: cs.filter(c => ok(c) && S.live.status[drvKey(c, day)]).length, missing: cs.filter(c => !ok(c)).length }; }
function deskCard() {
  if (S.loc !== 'ALL') return '';
  const ds = dates(), t = opDay(S.base.duties), next = ds.find(x => x > t), hour = Number(new Date().toLocaleTimeString('en-GB', { hour: '2-digit', hour12: false, timeZone: TZ }));
  const tomorrow = new Date(Date.parse(t + 'T12:00:00+05:30') + 86400000).toLocaleDateString('en-CA', { timeZone: TZ });
  const days = [];
  if (ds.indexOf(t) >= 0) { const g = msgStats(t, true); if (g.left + g.wait) days.push([t, 'Today']); }   /* today: only if guests still need their car details */
  if (next && (next !== tomorrow || hour >= 12)) days.push([next, next === tomorrow ? 'Tomorrow' : dayLabel(next)]);
  return days.map(([day, lbl]) => {
    const g = msgStats(day, day === t), dv = drvStats(day), gDone = !(g.left + g.wait), dDone = dv.sent === dv.all;
    if (day === t) return gDone ? '' : `<div class="msgc"><div class="mh">📩 Today: ${g.left + g.wait} guest${g.left + g.wait > 1 ? 's still need' : ' still needs'} car details</div><div class="mrow"><button data-gmb="${day}"><b>${g.sent}/${g.all}</b> guests${g.wait ? ` <span class="red">· ${g.wait} waiting</span>` : ''} ›</button></div></div>`;
    return `<div class="msgc ${gDone && dDone ? 'ok' : ''}"><div class="mh">📩 ${lbl}'s messages${gDone && dDone ? ' · all sent ✓' : ''}</div>
      <div class="mrow"><button data-dl="${day}"><b>${dv.sent}/${dv.all}</b> drivers${dv.missing ? ` <span class="red">· ${dv.missing} no driver</span>` : ''} ›</button>
      <button data-gmb="${day}"><b>${g.sent}/${g.all}</b> guests${g.wait ? ` <span class="red">· ${g.wait} waiting</span>` : ''} ›</button></div></div>`;
  }).join('');
}

function renderCoord() {

  if (!locs().some(l => l[0] === S.loc)) S.loc = 'ALL';
  const L = S.loc, y = window.scrollY;

  wireHeader();

/* ---------- one trip: everything needed on the floor ---------- */
function tripText(d) {
  const c = carInfo(d.date, d.car), L = ['🚗 *' + d.car + (c.reg ? ' · ' + c.reg : '') + '*', '🕐 *' + hm(d.report) + '* ' + pname(d.from) + ' ➜ ' + pname(d.to), ''];
  const sch = schedTime(d), tr = d.guests[0] && d.guests[0].trip ? d.guests[0].trip.replace(/ \(.*$/, '') : '';
  if (tr) L.push((d.from === 'AIR' || d.to === 'AIR' ? '✈ ' : '🚆 ') + tr + (sch ? ' ' + sch.replace(/^\S+ /, '') : ''));

/* ---------- edit ---------- */
/* cars to offer in a dropdown: those with a driver + phone. Before any driver is entered for that day,
   every planned car is offered (marked "no driver yet") so the plan can still be changed. */
function pickable(date) {
  const day = S.base.cars.filter(c => c.date === date), has = c => String(c.driver || '').trim() && String(c.phone || '').trim(), home = c => /HOME/i.test(c.source || '');
  const hired = day.filter(c => !home(c)), ok = hired.filter(has), fam = day.filter(c => home(c) && has(c));
  const list = (ok.length ? ok : hired).concat(fam);
  return { cars: [...new Set(list.map(c => c.car))], hidden: ok.length ? hired.length - ok.length : 0, none: hired.length > 0 && !ok.length };
}
const drvTag = (date, n) => { const c = carInfo(date, n), dn = String(c.driver || '').trim(); return dn && String(c.phone || '').trim() ? esc(dn.split(' ')[0]) : 'no driver yet'; };
const pickNote = p => p.none ? '<div class="meta" style="margin-top:6px">No drivers entered for this day yet - add them in Cars.</div>' : p.hidden ? `<div class="meta" style="margin-top:6px">${p.hidden} car${p.hidden > 1 ? 's' : ''} hidden - no driver/phone. Add in Cars.</div>` : '';
/* a trip moved by some minutes (delay or new time) - used to check cars at the new time */
const shiftTrip = (d, min) => Object.assign({}, d, { report: d.report + min * 60000, leave: d.leave + min * 60000, reach: d.reach + min * 60000, busy: (d.busy || d.reach) + min * 60000 });
const toMin = t => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(t || '')); return m ? Number(m[1]) * 60 + Number(m[2]) : null; };
function editTrip(d) {
  const pk = pickable(d.date), i = st(d);
  const names = [...new Set(pk.cars.concat([d.car]))].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  const w = d.event ? S.base.waves.find(x => x.date === d.date && x.from === d.from && x.to === d.to && Math.abs((x.report || 0) - d.report) < 60000) : null;
  /* the time a coordinator can change: event = round leaves at; pickup = train/flight arrives; drop = departs; check-out move = car leaves */
  const tLabel = d.event ? 'Leaves at' : d.type === 'Guest pickup' ? 'Train / flight now arrives at' : d.type === 'Guest drop' ? 'Train / flight now departs at' : 'Car leaves at';
  const t0 = d.event ? (w ? w.leave : hm(d.leave)) : (d.type === 'Hotel transfer' ? hm(d.leave) : (schedTime(d).replace(/^\S+ /, '') || hm(d.leave)));
  let dd = d;
  const optsHtml = (x, sel) => names.map(n => ({ n, ok: canDo(n, x), at: lastPlace(n, x.date, x.report), h: isHome(x.date, n) }))
    .sort((a, b) => (b.n === sel) - (a.n === sel) || a.h - b.h || b.ok - a.ok || (b.at === x.from) - (a.at === x.from) || a.n.localeCompare(b.n, undefined, { numeric: true }))
    .map(o => `<option value="${o.n}" ${o.n === sel ? 'selected' : ''}>${o.n} · ${drvTag(x.date, o.n)}${o.h ? ' 🏠' : ''}${o.n === d.car ? ' (now)' : ''}${o.ok ? ' · free' + (o.at && o.n !== d.car ? ' · at ' + sp(o.at) : '') : ' · ' + esc(busyText(o.n, x))}</option>`).join('');
  sheet(`<h3>${esc(d.car)} · ${hm(d.leave)}</h3><div class="meta">${esc(sp(d.from))} → ${esc(sp(d.to))}</div>
    <div class="grid2"><div><label>${tLabel}</label><input id="e_t" type="time" value="${esc(t0)}"></div>${w ? `<div><label>People (whole round)</label><input id="e_p" type="number" inputmode="numeric" value="${w.pax}"></div>` : '<div></div>'}</div>
    <div id="e_tm" class="meta"></div>
    <label>Car</label><select id="e_car">${optsHtml(d, d.car)}</select>${pickNote(pk)}
    <div id="e_sw"></div>
    <button class="btn pri big" style="width:100%;margin-top:16px" id="e_save">Save</button>
    <div class="lnk">${i.done ? '' : '<a id="e_prob">⚠️ Problem</a>'}${i.st ? '<a id="e_undo">↩ Clear status</a>' : ''}${i.done ? '' : '<a id="e_cancel">✕ Cancel trip</a>'}</div>`, () => {
    const upd = (retime) => {
      const m0 = toMin(t0), m1 = toMin($('#e_t').value), delta = m0 != null && m1 != null ? m1 - m0 : 0;
      dd = delta ? shiftTrip(d, delta) : d;
      if (retime) $('#e_car').innerHTML = optsHtml(dd, $('#e_car').value);
      $('#e_tm').innerHTML = delta ? `${delta > 0 ? '+' : ''}${delta} min · car at ${esc(sp(d.from))} by <b>${hm(dd.report)}</b>, reaches ${esc(sp(d.to))} ~${hm(dd.reach)}` : '';
      const car = $('#e_car').value, cf = conflicts(car, dd);
      const own = car === d.car && cf.length ? `<div class="clw">⚠ ${esc(car)} is busy at the new time - pick a free car above</div>` : '';
      $('#e_sw').innerHTML = own + (cf.length && !delta && car !== d.car ? `<div class="swbox"><b>${esc(car)} is busy then</b>${cf.map(o => `<button class="btn pri" data-swap="${esc(o.key)}">⇄ Swap: ${esc(car)} takes this, ${esc(d.car)} takes ${hm(o.leave)} ${esc(sp(o.from))}→${esc(sp(o.to))}</button>`).join('')}</div>` : '');
      const sv = $('#e_save'); sv.textContent = cf.length ? 'Save anyway (will show as clash)' : 'Save'; sv.className = 'btn big ' + (cf.length ? 'warnb' : 'pri');
      $$('[data-swap]').forEach(b => b.onclick = () => lockBtn(b) && call('logiApp_swapTrips', [S.pin, S.who, d.key, b.dataset.swap], r => { closeSheet(); S.open = {}; apply(r); toast('✓ Cars swapped'); }));
    };
    $('#e_car').onchange = () => upd(false); $('#e_t').oninput = () => upd(true);
    $('#e_save').onclick = () => {
      const car = $('#e_car').value, tNew = $('#e_t').value, ch = { car };
      if (w) { ch.leave = tNew; ch.pax = $('#e_p').value; }
      else if (tNew && tNew !== t0) ch.time = tNew;
      if (car === d.car && !ch.time && (!w || (ch.leave === w.leave && Number(ch.pax) === w.pax))) return closeSheet();
      const willClash = conflicts(car, dd).length > 0;
      if (!lockBtn($('#e_save'))) return;
      call('logiApp_editTrip', [S.pin, S.who, d.key, ch], r => { closeSheet(); S.open = {}; apply(r); toast(willClash ? '⚠ Saved - shows as clash' : ch.time ? '✓ New time saved for everyone on this trip' : '✓ Saved'); });
    };
    const pb = $('#e_prob'); if (pb) pb.onclick = () => sendStep(d, 'Problem', coordSend);
    const ub = $('#e_undo'); if (ub) ub.onclick = () => { closeSheet(); coordSend(d.key, 'Reset', null, ''); };
    const cb = $('#e_cancel'); if (cb) cb.onclick = () => { if (confirm('Cancel this trip?')) { closeSheet(); coordSend(d.key, 'Cancelled', null, 'Cancelled by ' + S.who); } };
    upd(false);
  });
}

/* hired car needs a driver + phone; a cab is booked on the day; both contacts must be set for the day */
const msgReady = d => contactsOk(d.date) && (/^Cab /.test(d.car) || (!!carInfo(d.date, d.car).driver && okPhone(carInfo(d.date, d.car).phone)));
const msgKey = (d, g) => 'MSG|' + d.key + '|' + g.id;
function msgTrips(day) { return S.base.duties.filter(d => d.date === day && !d.event && d.guests.length).sort((a, b) => a.report - b.report); }
function msgStats(day, upcoming) {
  const o = { all: 0, sent: 0, left: 0, wait: 0, nophone: 0 };
  msgTrips(day).filter(d => !upcoming || d.report > Date.now()).forEach(d => d.guests.forEach(g => {

const trainTc = t => String(t || '').split(' ').map(w => /^[A-Z]{4,}$/.test(w) ? w[0] + w.slice(1).toLowerCase() : w).join(' ');

    const wait = phase === 'go' && d.report - now > 45 * 60000 ? `<div class="wait">⏳ ${dur(d.report - now)} बाकी · free till ${hm(d.report - (drive(lastPlace2(d), d.from) + 10) * 60000)}</div>` : '';
    const sch = schedTime(d);
    const rb = phase === 'go' && d === trips[0] ? cars.map(c => bookOf(S.date, c.car)).filter(Boolean).sort((a, b) => a.from - b.from)[0] : null;
    const chips = (rb && now < d.report ? [`🏨 ${hm(rb.from)} होटल रिपोर्ट · hotel report`] : []).concat([`👥 ${d.pax}`]).concat(sch ? [sch] : [], d.hampers && phase !== 'drop' ? [`🎁 ${d.hampers} हैम्पर दें`] : [], /standby/.test(d.type) && phase === 'drop' ? ['⏳ वहीं रुकें · wait there'] : []);
    const guests = phase !== 'drop' && d.guests.length ? `<div class="dg">${d.guests.map(g => `<div><span>${esc(g.name.split(' ').map(w => w[0] + w.slice(1).toLowerCase()).join(' '))}</span>${okPhone(g.phone) ? `<a class="ic call sm2" href="tel:+${digits(g.phone)}">📞</a>` : ''}</div>`).join('')}</div>`
      : phase !== 'drop' && d.event ? '<div class="dg"><div><span class="mut">कोऑर्डिनेटर लोग बैठाएँगे · coordinator will send people</span></div></div>' : '';
    main = `<div class="dstate ${i.late && !i.done ? 'late' : ''}">
      <div class="ph">${bi((title2 || title)[0], (title2 || title)[1])}</div>
      <div class="dplace">${esc(dp(place))}</div>
      <div class="dwhen"><b>${when}</b><small>${whenL}</small></div>
      ${wait}
      <div class="chips2">${chips.map(c => `<span>${c}</span>`).join('')}</div>
      ${guests}
      <a class="btn nav" target="_blank" href="${plink(place)}">🧭 ${bi('रास्ता', 'Navigate')}</a>
      ${phase === 'drop' ? '' : `<div class="dto">➜ ${esc(dp(d.to))}</div>`}
    </div>
    <div class="dbot"><button class="btn pri dgo" data-go="${esc(d.key)}" data-st="${nx}">${bi(btn[0], btn[1])}</button>
      <button class="dprob" data-prob="${esc(d.key)}">⚠️ दिक्कत · Problem</button></div>`;
  }
  $('#app').innerHTML = `<div class="dwrap">${top}${main}</div>`;
  $('#list').onclick = () => sheet(`<h3>${dayLabel(S.date)}</h3>${trips.map(x => { const k = st(x); return `<div class="mini ${k.done ? 'mut' : ''}"><span><b>${hm(x.report)}</b> ${esc(dp(x.from))} ➜ ${esc(dp(x.to))}</span><span>${k.done ? '✓' : '👥 ' + x.pax}</span></div>`; }).join('') || '<div class="meta">—</div>'}
    ${[...new Set(r.cars.map(c => c.date))].length > 1 ? `<div class="chips" style="margin-top:12px">${[...new Set(r.cars.map(c => c.date))].sort().map(x => `<span data-dd="${x}" class="${x === S.date ? 'on' : ''}">${x === today() ? 'आज' : dayLabel(x)}</span>`).join('')}</div>` : ''}
    <label class="switch" style="margin-top:14px"><span>📍 ${bi('लोकेशन शेयर', 'Share location with desk')}</span><input type="checkbox" id="shr" ${S.share ? 'checked' : ''}></label>
    <button class="btn ghost" style="width:100%;margin-top:10px" data-close>OK</button>`, () => { $$('[data-dd]').forEach(b => b.onclick = () => { S.date = b.dataset.dd; closeSheet(); renderDriver(); }); $('#shr').onchange = e => { S.share = e.target.checked; store.set('la_share', S.share ? '1' : '0'); startShare(); }; });
  $$('[data-go]').forEach(b => b.onclick = () => {
    if (!S.share) { S.share = true; store.set('la_share', '1'); startShare(); }
    pingNow();
    const x = trips.find(t => t.key === b.dataset.go), stx = b.dataset.st;
    const prev = r.status[x.key] ? Object.assign({}, r.status[x.key]) : null;
    drvSend(x.key, stx, stx === 'Guests in car' ? x.pax : null, '', () => prev ? drvSend(x.key, prev.status, prev.pax, prev.note) : drvSend(x.key, 'Reset', null, ''));
  });
  $$('[data-prob]').forEach(b => b.onclick = () => sendStep(trips.find(t => t.key === b.dataset.prob), 'Problem', drvSend));
}
function lastPlace2(d) { const p = S.drv.duties.filter(o => o.date === d.date && o.reach <= d.report && o.key !== d.key).sort((a, b) => b.reach - a.reach)[0]; return p ? p.to : d.from; }
let watchId = null, lastPing = 0;
/* one location fix with every big-button tap, so the desk sees where the car was at that moment */
function pingNow() {
  if (!S.share || !navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => { lastPing = Date.now(); google.script.run.withFailureHandler(() => {}).driverApp_ping(PARAMS.d, p.coords.latitude, p.coords.longitude, p.coords.accuracy); }, () => {}, { enableHighAccuracy: true, maximumAge: 30000, timeout: 15000 });
}
function startShare() {
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  if (!S.share || !navigator.geolocation) return;
  watchId = navigator.geolocation.watchPosition(p => {
    if (Date.now() - lastPing < 90000) return; lastPing = Date.now();
    google.script.run.withFailureHandler(() => {}).driverApp_ping(PARAMS.d, p.coords.latitude, p.coords.longitude, p.coords.accuracy);
  }, () => {}, { enableHighAccuracy: true, maximumAge: 60000 });
}

/* ---------- start ---------- */
if (DRIVER) {
  S.share = store.get('la_share') !== '0';   /* location is on by default (the phone asks once) */
  loadDriver(); setInterval(() => { if (!document.hidden && !$('.ov')) loadDriver(true); }, 60000); startShare();
} else {
  if (PARAMS.c || PARAMS.s) {
    /* personal link (c) or saved sign-in (s): no PIN needed */
    S.pin = PARAMS.c ? 'C:' + PARAMS.c : 'S:' + PARAMS.s;
    const known = store.get('la_pin') === S.pin && store.get('la_who');
    const cached = known && readCache();
    if (cached) { S.who = store.get('la_who'); afterLogin(cached); call('logiApp_load', [S.pin], r => { apply(r); }, true); }
    else call('logiApp_whoami', [S.pin], name => { S.who = name || 'Team'; store.set('la_pin', S.pin); store.set('la_who', S.who); call('logiApp_load', [S.pin], r => { saveCache(r); afterLogin(r); }); });
  } else {
    S.pin = store.get('la_pin'); S.who = store.get('la_who');
    if (S.pin.indexOf('S:') === 0) keepUrl({ app: 'logistics', s: S.pin.slice(2) });
    else if (S.pin.indexOf('C:') === 0) keepUrl({ app: 'logistics', c: S.pin.slice(2) });
    else if (S.pin && S.who) call('logiApp_session', [S.pin, S.who], tok => { S.pin = 'S:' + tok; store.set('la_pin', S.pin); keepUrl({ app: 'logistics', s: tok }); }, true);   /* old plain-PIN sign-in: upgrade to a link sign-in */
    const cached = S.pin && S.who && readCache();
    if (cached) { afterLogin(cached); call('logiApp_load', [S.pin], r => { apply(r); }, true); }
    else if (S.pin && S.who) call('logiApp_load', [S.pin], r => { saveCache(r); afterLogin(r); }); else renderLogin();
  }
}
</script>
</body>
